# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: zh-CN

# Change to your timezone
timezone: Asia/Shanghai

# jekyll-seo-tag settings
# ↓ --------------------------

title: 技术笔记 # the main title

tagline: 做喜欢的事，每天进步一点点 # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  记录 Python、Linux、MCU 及日常工具相关的技术笔记。

# Fill in the protocol & hostname for your site.
url: "https://hjfbswb.github.io"

github:
  username: hjfbswb

social:
  name: 技术笔记
  email: hjfbswb@126.com
  links:
    - https://github.com/hjfbswb

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Prefer color scheme setting.
# Available options: light | dark; empty follows the system preference.
theme_mode: dark

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpg

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider: # disabled

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      # Keep post URLs compatible with the previous TeXt setup
      permalink: /:year/:month/:day/:title.html
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock
  - vendor
  - _site
  - CLAUDE.md

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
